<text x="200.0" y="701.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">计时、和弦、长音与灯光判定</text><polyline points="200.0,710 200.0,731" fill="none" stroke="#365766" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="15" y="731" width="370" height="67" rx="8" fill="#f1f6f8" stroke="#496b7a" stroke-width="2"/><text x="200.0" y="760.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">game_stop()</text><text x="200.0" y="789.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">清除运行状态并关闭谱面流</text><text x="600.0" y="449" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="25" font-weight="700" fill="#172b36">USB磁盘</text><rect x="415" y="467" width="370" height="67" rx="8" fill="#f1f6f8" stroke="#496b7a" stroke-width="2"/><text x="600.0" y="496.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">usb_disk_toggle()</text><text x="600.0" y="525.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">完成本地媒体并同步、卸载FatFs</text><polyline points="600.0,534 600.0,555" fill="none" stroke="#365766" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="415" y="555" width="370" height="67" rx="8" fill="#f1f6f8" stroke="#496b7a" stroke-width="2"/><text x="600.0" y="584.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">usb_service() / usb_request()</text><text x="600.0" y="613.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">身份、长度与CRC16校验</text><polyline points="600.0,622 600.0,643" fill="none" stroke="#365766" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="415" y="643" width="370" height="67" rx="8" fill="#f1f6f8" stroke="#496b7a" stroke-width="2"/><text x="600.0"
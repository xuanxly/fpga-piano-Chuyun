<svg xmlns="http://www.w3.org/2000/svg" width="800" height="820" viewBox="0 0 800 820"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#365766"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="200.0" y="34" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="25" font-weight="700" fill="#172b36">录音保存</text><rect x="15" y="52" width="370" height="67" rx="8" fill="#f1f6f8" stroke="#496b7a" stroke-width="2"/><text x="200.0" y="81.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">start_record()</text><text x="200.0" y="110.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">新建WAV并写初始头</text><polyline points="200.0,119 200.0,140" fill="none" stroke="#365766" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="15" y="140" width="370" height="67" rx="8" fill="#f1f6f8" stroke="#496b7a" stroke-width="2"/><text x="200.0" y="169.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">drain_record()</text><text x="200.0" y="198.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">HW_REC_POP → 缓冲 → f_write</text><polyline points="200.0,207 200.0,228" fill="none" stroke="#365766" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="15" y="228" width="370" height="67" rx="8" fill="#f1f6f8" stroke="#496b7a" stroke-width="2"/><text x="200.0" y="257.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">finish_record()</text><text x="200.0" y="286.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">停采集、排空剩余FIFO</text><polyline points="200.0,295 200.0,316" fill="none" stroke="#365766" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="15" y="316" width="370" height="67" rx="8" fill="#f1f6f8" stroke="#496b7a" stroke-width="2"/><text x="200.0" y="345.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">wave_header(recorded)</text><text x="200.0" y="374.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">回写长度、截断并关闭文件</text><text x="600.0" y="34" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="25" font-weight="700" fill="#172b36">文件播放</text><rect x="415" y="52" width="370" height="67" rx="8" fill="#f1f6f8" stroke="#496b7a" stroke-width="2"/><text x="600.0" y="81.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">open_entry() / wave_open()</text><text x="600.0" y="110.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">检查WAV格式与采样参数</text><polyline points="600.0,119 600.0,140" fill="none" stroke="#365766" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="415" y="140" width="370" height="67" rx="8" fill="#f1f6f8" stroke="#496b7a" stroke-width="2"/><text x="600.0" y="169.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">fill_playback()</text><text x="600.0" y="198.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">读取、解码并重采样</text><polyline points="600.0,207 600.0,228" fill="none" stroke="#365766" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="415" y="228" width="370" height="67" rx="8" fill="#f1f6f8" stroke="#496b7a" stroke-width="2"/><text x="600.0" y="257.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">HW_PLAY_PUSH</text><text x="600.0" y="286.5" text-anchor="middle" font-family="Microsoft YaHei, SimSun" font-size="21" font-weight="400" fill="#172b36">将立体声PCM